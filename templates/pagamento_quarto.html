<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pagamento - Quarto {{ quarto_codigo }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.container { max-width: 600px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
h1, h2 { text-align: center; color: #4b2200; }
label { font-weight: bold; margin-top: 10px; display: block; }
input, select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
button { width: 48%; margin-top: 15px; padding: 10px; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; }
.btn-confirm { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; }
.btn-confirm:hover { background-color: #5a2e00; }
.btn-cancel { background-color: #a52a2a; color: #fff8f0; border: 1px solid #7b0000; }
.btn-cancel:hover { background-color: #7b0000; }
img.qrcode { display: block; margin: 20px auto; max-width: 250px; border-radius: 10px; }
.quarto-info img { max-width: 100%; border-radius: 10px; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="container">
    <h1>Pagamento do Quarto {{ quarto_codigo }}</h1>

    <div class="quarto-info">
       <img src="/imagens/qrcode.jpg" alt="QRCode" class="qrcode">
        <p><strong>Quarto:</strong> {{ quarto_codigo }}</p>
        <p><strong>Check-in:</strong> {{ checkin }}</p>
        <p><strong>Check-out:</strong> {{ checkout }}</p>
        <p><strong>Total a pagar:</strong> R$ {{ total }}</p>
        
    </div>

    <form method="post" action="/reservar/{{ reserva_id }}/pagar">
        <input type="hidden" name="reserva_id" value="{{ reserva_id }}">
        <input type="hidden" name="metodo" value="{{ metodo }}">

        {% if metodo == 'cartao_credito' %}
            <label>Número do cartão:</label>
            <input type="text" name="numero_cartao" required>
            
            <label>Nome no cartão:</label>
            <input type="text" name="nome_cartao" required>
            
            <label>Validade:</label>
            <input type="month" name="validade_cartao" required>
            
            <label>CVV:</label>
            <input type="text" name="cvv" required>


        {% else %}


        {% endif %}


        <div class="d-flex justify-content-between">
            <button type="submit" class="btn-confirm">Confirmar Pagamento</button>
        <a href="/cancelar_reserva/{{ reserva_id }}" class="btn btn-medieval mt-2">Desistir da Reserva</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
