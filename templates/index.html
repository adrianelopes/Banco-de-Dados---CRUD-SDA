<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD Quartos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

<h1>Quartos</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Disponível</th>
        </tr>
    </thead>
    <tbody>
        {% for quarto in quartos %}
        <tr>
            <td>{{ quarto.id }}</td>
            <td>{{ quarto.numero }}</td>
            <td>{{ quarto.tipo }}</td>
            <td>{{ quarto.valor }}</td>
            <td>{{ quarto.disponivel }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h2>Adicionar Quarto</h2>
<form action="/add" method="post">
    <input type="text" name="numero" placeholder="Número" class="form-control mb-2">
    <input type="text" name="tipo" placeholder="Tipo" class="form-control mb-2">
    <input type="number" name="valor" placeholder="Valor" class="form-control mb-2">
    <input type="text" name="disponivel" placeholder="Disponível" class="form-control mb-2">
    <button type="submit" class="btn btn-primary">Adicionar</button>
</form>

</body>
</html>
