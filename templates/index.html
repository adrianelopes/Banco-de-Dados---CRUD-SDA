<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pônei Saltitante - Reservas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonte medieval/fantasia -->
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4e9dc; /* tom de pergaminho */
            font-family: 'MedievalSharp', cursive;
        }

        .navbar {
            background-color: #7b3f00; /* marrom medieval */
        }

        .navbar-brand {
            font-size: 1.8rem;
            color: #f4e9dc !important;
        }

        .card {
            border: 2px solid #7b3f00;
            background-color: #fff8f0;
        }

        .btn-medieval {
            background-color: #7b3f00;
            color: #f4e9dc;
            border: 1px solid #5a2e00;
        }

        .btn-medieval:hover {
            background-color: #5a2e00;
            color: #fff8f0;
        }

        h1, h2, h3 {
            color: #4b2200;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Pônei Saltitante</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Reserva de Quartos</h1>
    <div class="row" id="quartos-container">
        <!-- Card de exemplo -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Quarto do Hobbit</h5>
                    <p class="card-text">Tipo: Pequeno e aconchegante 🛏</p>
                    <p class="card-text">Preço: 10 moedas/dia 💰</p>
                    <p class="card-text">Serviços: Café da manhã, cerveja da casa 🍺</p>
                    <button class="btn btn-medieval">Reservar</button>
                </div>
            </div>
        </div>
        <!-- Você pode duplicar este bloco para mais quartos -->
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
