<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Solicitar Reserva - Pônei Saltitante</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.navbar { background-color: #7b3f00; }
.navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
.btn-medieval { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; }
.btn-medieval:hover { background-color: #5a2e00; color: #fff8f0; }
input, textarea { margin: 5px 0; padding: 5px; width: 100%; }
h1 { color: #4b2200; }
.reserva-container {
  display: flex;
  gap: 30px;
  align-items: flex-start;
  margin-top: 30px;
}
.quarto-imagem img {
  border: 12px solid #5a2e00;
  padding: 5px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  max-width: 350px;
  object-fit: cover;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Pônei Saltitante</a>
  </div>
</nav>

<div class="container reserva-container">
  <!-- Imagem do quarto -->
  <div class="quarto-imagem">
    <img src="{{ foto_url }}" alt="Foto do quarto {{ quarto_tipo }}">
  </div>

  <div class="quarto-info flex-grow-1">
    <h1>Solicitar Reserva do Quarto {{ quarto_id }}</h1>
    <form method="post" action="/clientes/reservar/{{ quarto_id }}">
      <label>Nome do Cliente:</label>
      <input type="text" name="nome_cliente" required>

      <label>Email do Cliente:</label>
      <input type="email" name="email_cliente" required>

      <label>Check-in:</label>
      <input type="date" name="checkin" required>

      <label>Check-out:</label>
      <input type="date" name="checkout" required>

      <label>Observações:</label>
      <textarea name="observacoes" placeholder="Ex: Café da manhã, travesseiro extra..." rows="3"></textarea>

      <button type="submit" class="btn btn-medieval mt-2">Enviar Solicitação</button>
    </form>

    <div class="mt-3">
      <a href="/quartos" class="btn btn-medieval">Voltar</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
