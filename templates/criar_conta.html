<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Criar Conta - Pônei Saltitante</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.navbar { background-color: #7b3f00; }
.navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
.btn-medieval { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; padding: 10px 20px; }
.btn-medieval:hover { background-color: #5a2e00; color: #fff8f0; }
input { width: 100%; margin: 5px 0; padding: 5px; border-radius: 5px; border: 2px solid #7b3f00; background-color: #fff8f0; }
.error { color: red; }
.container { max-width: 500px; margin-top: 50px; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Pônei Saltitante</a>
    </div>
</nav>

<div class="container">
    <h1>Criar Conta</h1>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/criar_conta">
    <input type="hidden" name="tipo" value="{{ tipo }}">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="senha" placeholder="Senha" required>
    <button type="submit" class="btn btn-medieval">Criar Conta</button>
</form>
    <div class="mt-3">
        <a href="/login" class="btn btn-medieval">Voltar para Login</a>
    </div>
</div>
</body>
</html>
