<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login - Pônei Saltitante</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.navbar { background-color: #7b3f00; }
.navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
.btn-medieval { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; padding: 0.5rem 1.5rem; }
.btn-medieval:hover { background-color: #5a2e00; color: #fff8f0; }
input, textarea { margin: 5px 0; padding: 8px; width: 100%; border: 2px solid #7b3f00; border-radius: 5px; background-color: #fff8f0; }
h1 { color: #4b2200; margin-bottom: 20px; }
.login-container {
    display: flex;
    flex-direction: column;
    max-width: 400px;
    margin: 50px auto;
    padding: 30px;
    border: 8px solid #5a2e00;
    border-radius: 15px;
    background-color: #fff8f0;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.error-msg { color: red; margin-bottom: 10px; }
.button-group {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Pônei Saltitante</a>
    </div>
</nav>

<div class="login-container">
    <h1>Login</h1>
    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
        <label>Email:</label>
        <input type="text" name="email" required>
        
        <label>Senha:</label>
        <input type="password" name="senha" required>
        
        <div class="button-group">
            <button type="submit" class="btn btn-medieval">Entrar</button>
            <a href="/criar_conta" class="btn btn-medieval">Criar Conta</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
