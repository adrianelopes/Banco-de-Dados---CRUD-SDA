<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Todos os Quartos - Pônei Saltitante</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.navbar { background-color: #7b3f00; }
.navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
.card { border: 2px solid #7b3f00; background-color: #fff8f0; }
.btn-medieval { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; }
.btn-medieval:hover { background-color: #5a2e00; color: #fff8f0; }
.btn-delete { background-color: #a00; color: #fff; border: 1px solid #700; }
.btn-delete:hover { background-color: #700; }
h1 { color: #4b2200; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Pônei Saltitante</a>
    </div>
</nav>

<div class="container mt-5">
    <h1>Todos os Quartos</h1>
    <div class="row mt-4">
        {% for quarto in quartos %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ quarto.tipo }} - Quarto {{ quarto.numero }}</h5>
                    <p class="card-text">Preço: {{ quarto.valor }} moedas/dia 💰</p>
                    <p class="card-text">Disponível: <span id="disp-{{ quarto.id }}">{{ quarto.disponivel }}</span></p>

                    {% if quarto.disponivel == "Sim" %}
                    <button class="btn btn-medieval reservar-btn" data-id="{{ quarto.id }}">Reservar</button>
                    {% else %}
                    <button class="btn btn-medieval" disabled>Reservado</button>
                    {% endif %}

                    <a href="/delete/{{ quarto.id }}" class="btn btn-delete mt-2">Deletar</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <a href="/add" class="btn btn-medieval mt-3">Adicionar Novo Quarto</a>
</div>

<script>
document.querySelectorAll('.reservar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        fetch(`/reservar/${id}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                document.getElementById(`disp-${id}`).innerText = 'Não';
                btn.disabled = true;
                btn.innerText = 'Reservado';
            } else {
                alert('Quarto já reservado!');
            }
        });
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
