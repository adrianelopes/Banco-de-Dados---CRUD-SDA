<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Adicionar Quarto - Pônei Saltitante</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.navbar { background-color: #7b3f00; }
.navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
.btn-medieval { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; }
.btn-medieval:hover { background-color: #5a2e00; color: #fff8f0; }
input, select {
    margin: 5px 0;
    padding: 5px;
    width: 100%;
    background-color: #fff;   /* fundo branco */
    border: 1px solid #ccc;   /* borda cinza clara */
    border-radius: 4px;       /* cantos arredondados */
    box-sizing: border-box;   /* borda dentro do tamanho total */
}
h1 { color: #4b2200; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Pônei Saltitante</a>
    </div>
</nav>

<div class="container mt-5">
    <h1>Adicionar Quarto</h1>
    <form method="post" action="/add">
     <select name="tipo" required>
        <option value="">Selecione o tipo de quarto</option>
        <option value="hobbit">Hobbit</option>
        <option value="anao">Anão</option>
        <option value="elfo">Elfo</option>
    </select>
    <input type="text" name="codigo" placeholder="Código do quarto" required>
    <input type="number" step="0.01" name="preco_diaria" placeholder="Preço (moedas/dia)" required>
   

    <button type="submit" class="btn btn-medieval mt-2">Adicionar Quarto</button>
    </form>
    <div class="mt-3">
        <a href="/quartos" class="btn btn-medieval">Ver Todos os Quartos</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
