<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Relatório - Pônei Saltitante</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
.navbar { background-color: #7b3f00; }
.navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
.card { border: 2px solid #7b3f00; border-radius: 12px; background-color: #fff8f0; }
h1 { color: #4b2200; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Pônei Saltitante</a>
    </div>
</nav>

<div class="container mt-4">
    <h1>Relatório de Quartos</h1>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>Total de Quartos</h5>
                <p>{{ total_quartos }}</p>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>Quartos Livres</h5>
                <p class="text-success">{{ quartos_livres }}</p>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>Quartos Ocupados</h5>
                <p class="text-danger">{{ quartos_ocupados }}</p>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>Valor Total em Reservas</h5>
                <p>R$ {{ valor_total_reservas }}</p>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>Valor Médio da Diária</h5>
                <p>R$ {{ valor_medio_diaria }}</p>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/quartos" class="btn btn-medieval">Voltar</a>
    </div>
</div>

</body>
</html>
