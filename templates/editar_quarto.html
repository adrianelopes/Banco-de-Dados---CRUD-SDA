<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Quarto - Pônei Saltitante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f4e9dc; font-family: 'MedievalSharp', cursive; }
    .navbar { background-color: #7b3f00; }
    .navbar-brand { font-size: 1.8rem; color: #f4e9dc !important; }
    .btn-medieval { background-color: #7b3f00; color: #f4e9dc; border: 1px solid #5a2e00; }
    .btn-medieval:hover { background-color: #5a2e00; color: #fff8f0; }
    input, select { margin: 5px 0; padding: 5px; width: 100%; background-color: #fff; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    h1 { color: #4b2200; }
    .medieval-card { background-color: #fff8f0; border: 2px solid #7b3f00; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Pônei Saltitante</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="medieval-card">
      <h1 class="mb-4 text-center">Editar Quarto</h1>

      <form method="post" action="/editar/{{ quarto.id }}">
        <div class="mb-3">
          <label for="codigo" class="form-label">Código</label>
          <input type="text" class="form-control" id="codigo" name="codigo" value="{{ quarto.codigo }}" required>
        </div>

        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo</label>
          <select class="form-select" id="tipo" name="tipo" required>
            <option value="">Selecione o tipo de quarto</option>
            <option value="hobbit" {% if quarto.tipo|lower == 'hobbit' %}selected{% endif %}>Hobbit</option>
            <option value="anao"   {% if quarto.tipo|lower == 'anao'   %}selected{% endif %}>Anão</option>
            <option value="elfo"   {% if quarto.tipo|lower == 'elfo'   %}selected{% endif %}>Elfo</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="preco_diaria" class="form-label">Preço da Diária</label>
          <input type="number" step="0.01" class="form-control" id="preco_diaria" name="preco_diaria" value="{{ quarto.preco_diaria }}" required>
        </div>

        <div class="d-flex justify-content-between">
          <a href="/listar_quartos" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-medieval">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
