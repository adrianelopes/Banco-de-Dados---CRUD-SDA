version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ponesaltitante_db
    restart: always
    environment:
      POSTGRES_USER: hobbit
      POSTGRES_PASSWORD: condado123
      POSTGRES_DB: ponesaltitante
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
